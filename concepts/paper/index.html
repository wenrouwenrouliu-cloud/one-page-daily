<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案 B｜东方数字馆</title>
<style>
:root{--paper:#e8dfc9;--paper2:#f5eedc;--ink:#17160f;--muted:#665f4f;--red:#a33b2c;--gold:#9f7b42;--line:rgba(46,39,27,.24)}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;line-height:1.75}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.48;background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.75),transparent 32%),radial-gradient(circle at 80% 30%,rgba(145,119,75,.08),transparent 38%),repeating-linear-gradient(8deg,rgba(79,62,38,.025) 0 1px,transparent 1px 6px)}
a{color:inherit;text-decoration:none}a:hover{color:var(--red)}
.wrap{width:min(1220px,calc(100% - 36px));margin:auto}
.top{padding:18px 0;border-bottom:1px solid var(--line)}.topin{display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:12px;letter-spacing:.18em}.seal{display:inline-grid;place-items:center;width:36px;height:36px;background:var(--red);color:#f8edd8;font:700 17px/1 "Songti SC",serif;transform:rotate(-3deg);box-shadow:inset 0 0 0 3px rgba(255,255,255,.2)}
.hero{padding:70px 0 54px;position:relative}.herogrid{display:grid;grid-template-columns:170px 1fr 170px;gap:38px;align-items:center}.side{writing-mode:vertical-rl;text-orientation:mixed;font-size:12px;letter-spacing:.4em;color:var(--muted);justify-self:center}.side.right{color:var(--red)}
.herocenter{text-align:center}.herocenter .date{font-size:13px;letter-spacing:.36em;color:var(--muted)}.hero h1{margin:26px 0 0;font-size:clamp(70px,13vw,160px);line-height:.82;font-weight:500;letter-spacing:.04em}.hero h1 span{display:block;font-size:.52em;letter-spacing:.34em;margin-top:26px;color:var(--red)}
.hero p{max-width:650px;margin:34px auto 0;color:var(--muted);font-size:14px;letter-spacing:.05em}.herorule{width:100%;height:1px;background:var(--line);margin-top:45px;position:relative}.herorule:after{content:"今";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper);padding:0 14px;color:var(--red)}
main{padding:18px 0 90px}.chapter{display:grid;grid-template-columns:110px 1fr;gap:32px;margin:0 0 78px}.chapnum{font-size:24px;color:var(--red);writing-mode:vertical-rl;letter-spacing:.18em;height:130px}.chapbody{border-top:2px solid var(--ink);padding-top:20px}
.chaphead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px}.chaphead h2{margin:0;font-size:clamp(40px,6vw,72px);line-height:1;font-weight:500;letter-spacing:.06em}.chaphead p{margin:0;color:var(--muted);font-size:12px;text-align:right;letter-spacing:.08em}
.scrollitem{display:grid;grid-template-columns:90px 1fr 170px;gap:28px;padding:25px 0;border-top:1px solid var(--line)}.scrollitem:last-child{border-bottom:1px solid var(--line)}.scrollitem .num{font-size:42px;line-height:1;color:var(--gold)}.scrollitem .tag{font-size:11px;color:var(--red);letter-spacing:.18em}.scrollitem h3{font-size:clamp(26px,3.4vw,42px);line-height:1.28;font-weight:500;margin:8px 0 10px}.scrollitem p{margin:0;color:var(--muted);font-size:13px}.scrollmeta{text-align:right;color:var(--muted);font-size:11px;letter-spacing:.08em}.scrollmeta strong{display:block;color:var(--ink);font-size:13px;margin-top:8px}
.deep{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.deep article{padding:30px}.deep article+article{border-left:1px solid var(--line)}.deep header{font-size:11px;color:var(--red);letter-spacing:.18em}.deep h3{font-size:32px;line-height:1.35;font-weight:500;margin:18px 0}.deep p{color:var(--muted);font-size:13px}.deep .act{margin-top:28px;padding-top:14px;border-top:1px solid var(--line);color:var(--red);font-size:12px}
.socialscroll{border-top:1px solid var(--line)}.plines{display:grid;grid-template-columns:130px 1fr 1fr;border-bottom:1px solid var(--line)}.plines>div{padding:20px;border-right:1px solid var(--line)}.plines>div:last-child{border-right:0}.plines h3{margin:0;font-size:26px;font-weight:500}.plines small{display:block;color:var(--muted);font-size:10px;margin-top:8px}.plines h4{margin:0 0 10px;color:var(--red);font-size:11px;letter-spacing:.18em}.paperrank{padding:8px 0;border-top:1px solid rgba(46,39,27,.12);font-size:12px}.paperrank:first-of-type{border-top:0}.paperrank b{color:var(--red);margin-right:8px}.paperrank em{font-style:normal;color:var(--muted);font-size:10px;display:block;margin-top:3px}
.partner{margin:0 0 78px;background:linear-gradient(135deg,#efe3c8,#f8f0dd);border:1px solid var(--line);padding:42px;position:relative}.partner:before,.partner:after{content:"";position:absolute;width:78px;height:78px;border:1px solid rgba(163,59,44,.32)}.partner:before{left:14px;top:14px;border-right:0;border-bottom:0}.partner:after{right:14px;bottom:14px;border-left:0;border-top:0}.partner .redseal{float:right;margin-left:24px}.partner h3{font-size:clamp(30px,4.4vw,52px);line-height:1.2;font-weight:500;margin:18px 0 12px;max-width:760px}.partner p{max-width:760px;color:var(--muted);font-size:13px}.partner .terms{margin-top:26px;color:var(--red);font-size:11px;letter-spacing:.12em}
.latest{display:grid;grid-template-columns:repeat(2,1fr);column-gap:36px}.lnews{padding:13px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:98px 1fr;gap:14px}.lnews b{color:var(--red);font-size:11px}.lnews small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
footer{border-top:1px solid var(--line);padding:22px 0 55px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px;letter-spacing:.08em}
@media(max-width:820px){.herogrid{grid-template-columns:1fr}.side{display:none}.chapter{grid-template-columns:1fr}.chapnum{writing-mode:horizontal-tb;height:auto}.chaphead{align-items:flex-start;flex-direction:column}.chaphead p{text-align:left}.scrollitem{grid-template-columns:60px 1fr}.scrollmeta{grid-column:2;text-align:left}.deep{grid-template-columns:1fr}.deep article+article{border-left:0;border-top:1px solid var(--line)}.plines{grid-template-columns:1fr}.plines>div{border-right:0;border-bottom:1px solid var(--line)}.latest{grid-template-columns:1fr}.partner .redseal{float:none}.hero h1{font-size:clamp(58px,20vw,100px)}footer{flex-direction:column}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin"><div><span class="seal">阅</span> &nbsp;东方数字馆 / DAILY SCROLL</div><div id="topDate">今日</div></div></header>
<section class="hero"><div class="wrap herogrid"><div class="side">一日一阅 / 过时不藏 / 仅呈今日</div><div class="herocenter"><div class="date" id="heroDate">—</div><h1>今日<span>阅见</span></h1><p>把互联网的热、远、深与新，收进一页纸上。只读今天，等明天再换新卷。</p></div><div class="side right">NO ARCHIVE / SAME LINK / DAILY RENEW</div></div><div class="wrap"><div class="herorule"></div></div></section>
<main class="wrap" id="app"></main>
<footer class="wrap"><span>SCROLL B / 东方数字馆</span><span>同一地址 · 每日覆盖 · 不保留旧页</span></footer>
<script src="../../daily-data.js"></script><script src="../concept-utils.js"></script><script>
const C=Concept,app=document.getElementById('app');document.getElementById('topDate').textContent=C.data.date;document.getElementById('heroDate').textContent=C.data.dateZh+' · '+C.data.weekday+'曜日';
const item=(x,i)=>`<article class="scrollitem"><div class="num">${['零','一','二','三','四'][i]}</div><div><div class="tag">${C.esc(x.category)} · ${C.esc(x.direction||'轻读')} · ${C.esc(x.time)}分钟</div><h3><a href="${C.url(x.url)}" target="_blank" rel="noopener">${C.esc(x.title)}</a></h3><p>${C.esc(x.summary)}</p></div><div class="scrollmeta">${C.esc(x.source)}<strong>${C.esc(x.action)}</strong></div></article>`;
const deep=(x,i)=>`<article><header>卷${['下','末'][i]} · ${C.esc(x.direction||x.category)}</header><h3><a href="${C.url(x.url)}" target="_blank" rel="noopener">${C.esc(x.title)}</a></h3><p>${C.esc(x.summary)}</p><div class="act">${C.esc(x.action)}</div></article>`;
const platform=p=>`<section class="plines"><div><h3>${C.esc(p.platform)}</h3><small>${C.esc(p.source)}</small></div><div><h4>最火</h4>${(p.hot||[]).slice(0,4).map(x=>`<div class="paperrank"><b>${x.rank}</b><a href="${C.url(x.url)}" target="_blank" rel="noopener">${C.esc(x.title)}</a><em>${C.esc(x.metricText)}</em></div>`).join('')}</div><div><h4>传播最快</h4>${(p.fast||[]).slice(0,4).map(x=>`<div class="paperrank"><b>${x.rank}</b><a href="${C.url(x.url)}" target="_blank" rel="noopener">${C.esc(x.title)}</a><em>${C.esc(x.speedLabel||'热度上升')}</em></div>`).join('')}</div></section>`;
app.innerHTML=`
<section class="chapter"><div class="chapnum">壹 / 伍</div><div class="chapbody"><div class="chaphead"><h2>四处观闻</h2><p>AI · 创业 · 全球 · 经济<br>轻松浏览，每条约五分钟</p></div>${C.light.map(item).join('')}</div></section>
<section class="chapter"><div class="chapnum">贰 / 伍</div><div class="chapbody"><div class="chaphead"><h2>两卷深读</h2><p>职业技能与人文成长<br>每日随机换题，中等理解</p></div><div class="deep">${C.deep.map(deep).join('')}</div></div></section>
<aside class="partner"><span class="seal redseal">合</span><div class="kicker">合作题跋 / BRAND COLOPHON</div><h3>让品牌像一段题跋，安静地留在今天。</h3><p>适合品牌观点、研究数据、产品笔记与工具更新。保持编辑判断，不加入追踪脚本、弹窗和自动播放。</p><div class="terms">ONE SLOT · EDITIONAL NATIVE · NO ARCHIVE</div></aside>
<section class="chapter"><div class="chapnum">叁 / 伍</div><div class="chapbody"><div class="chaphead"><h2>五站热度</h2><p>抖音 · 微博 · B站 · 小红书 · X<br>只记录今日，不向前追溯</p></div><div class="socialscroll">${C.platforms.map(platform).join('')}</div></div></section>
<section class="chapter"><div class="chapnum">肆 / 伍</div><div class="chapbody"><div class="chaphead"><h2>今日新入</h2><p>选题池，不作为必读清单</p></div><div class="latest">${C.latest.map(x=>`<div class="lnews"><b>${C.esc(x.source)}</b><div><a href="${C.url(x.url)}" target="_blank" rel="noopener">${C.esc(x.title)}</a><small>${C.esc(x.publishedText)}</small></div></div>`).join('')}</div></div></section>`;
</script>
</body>
</html>
